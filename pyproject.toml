[project]
name = "mcp-duck-search"
version = "0.1.0"
description = "MCP server providing web search tools via DuckDuckGo and SearXNG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
